name: FE Production CI/CD

# 트리거 정의
on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때마다 실행

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    # 환경 변수 정의
    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET_NAME: [S3_BUCKET_NAME] # 실제 버킷 이름으로 교체
      CF_DISTRIBUTION_ID: [CLOUDFRONT_DISTRIBUTION_ID] # CloudFront ID로 교체

    steps:
      # 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # Docker Build & 정적 파일 생성 (CI)
      - name: Docker Build and Extract Artifacts
        id: build
        run: |
          docker build -t frontend-builder .
          docker run --rm -v /tmp/dist:/app/dist frontend-builder sh -c 'cp -r /app/dist/. /tmp/dist'

      # AWS 인증 (IAM 권한 설정)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # S3 배포 (CD) -> dist 폴더의 내용을 S3 버킷으로 동기화
      - name: Deploy to S3
        run: |
          aws s3 sync /tmp/dist s3://${{ vars.S3_BUCKET_NAME }} --delete

      # CloudFront 캐시 무효화 (Invalidation)
      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
