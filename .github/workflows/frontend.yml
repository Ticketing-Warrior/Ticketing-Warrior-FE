name: FE Production CI/CD

on:
  push:
    branches:
      - feat/dev          

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    environment: AWS

    # 환경 변수 (job‑level)
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}                
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}   
      CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Docker Build & 정적 파일 추출
      - name: Docker Build and Extract Artifacts
        id: build
        run: |
          # 이미지 빌드 (Dockerfile 에서 Vite 빌드가 수행됩니다)
          docker build -t frontend-builder .
          # 컨테이너 실행 → 빌드된 정적 파일을 호스트 /tmp/dist 로 복사
          docker run --rm -v /tmp/dist:/dist frontend-builder \
            sh -c 'cp -r /app/dist/. /dist'

      # AWS 인증 (IAM 권한)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}   

      # S3 배포 (정적 파일 동기화)
      - name: Deploy to S3
        run: |
          aws s3 sync /tmp/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # CloudFront 캐시 무효화
      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"